<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dafler - Exchanges</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>

    <!-- Estilos de css -->
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <!-- Estilos externos -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  </head>
  <body>
    <header>
        <div class="logo-box"> 
            <a href="index.html">
                <span id="logo-img" class="material-symbols-rounded">translate</span>
                <div id="logo-text">Tándem Dafler App</div>
            </a>
        </div>

        <div class="nav-box">
            <ul><li><a href="index.html">Dashboard</a></li></ul>
            <ul><li><a href="exchanges.html">Intercambios</a></li></ul>
            <ul><li><a href="users.html">Usuarios</a></li></ul>
        </div>

        <div class="login-btn-box">
            <a href="login.html"><button>
                <span id="logo-img" class="material-symbols-rounded">login</span>
                <p>Login</p>
            </button></a>
        </div>
    </header>

    <main>
      <div class="container h-75 overflow-auto">
        <div class="mb-4">
          <h1>Intercambios</h1>
        </div>

        <div class="row g-4">
          <div class="col-lg-4">
            <div class="bg-white rounded p-4">
              <h3 class="mb-3">Nuevo intercambio</h3>

              <!-- Formulario para añadir intercambio -->
              <form id="form-add-user" novalidate>
                <div class="mb-3">
                  <label for="service" class="form-label">Servicio</label>
                  <input
                    type="text"
                    class="form-control"
                    id="service"
                    required
                  />
                </div>
                
                <div class="mb-3">
                  <label for="title" class="form-label">Título</label>
                  <input
                    type="text"
                    class="form-control"
                    id="title"
                    required
                  />
                </div>


                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="language" class="form-label">Idioma</label>
                      <select
                        type="text"
                        class="form-control"
                        id="language"
                        required
                    ></select>
                  </div>

                  <div class="col-md-6">
                    <label for="level" class="form-label">Nivel</label>
                  <select
                    class="form-select"
                    id="level"
                    required
                     ></select>
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6" id="native-lang">
                     <label for="modality" class="form-label">Modalidad</label>
                  <select
                    class="form-select"
                    id="modality"
                    required
                    ></select>
                  </div>
                  <div class="col-md-6" id="city">
                    <label for="user" class="form-label">Usuario</label>
                  <select
                    class="form-select"
                    id="user"
                    required
                    ></select>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="description" class="form-label">Descripción</label>
                  <textarea
                    class="form-control"
                    id="description"
                    rows="3"
                    required>
                  </textarea>
               </div>

                <button type="submit" class="btn btn-primary w-100">Añadir</button>
              </form>

            </div>
          </div>

          
        </div>
      </div>
    </main>

    <footer>
      <p>Tándem Dafler App · Producto 1 - FP.450 Desarrollo FullStack</p>
    </footer>
  </body>
  <script type="module" src="js/exchanges.js"></script>
</html>
