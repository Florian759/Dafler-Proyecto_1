<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dafler - Login</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <!-- Estilos de css -->
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <!-- Estilos externos -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  </head>
  <body>
    <header>
        <div class="logo-box"> 
            <a href="index.html">
                <span id="logo-img" class="material-symbols-rounded">translate</span>
                <div id="logo-text">Tándem Dafler App</div>
            </a>
        </div>

        <div class="nav-box">
            <ul><li><a href="index.html">Dashboard</a></li></ul>
            <ul><li><a href="">Intercambios</a></li></ul>
            <ul><li><a href="users.html">Usuarios</a></li></ul>
        </div>

        <div class="login-btn-box">
            <a href="login.html"><button>
                <span id="logo-img" class="material-symbols-rounded">login</span>
                <p>Login</p>
            </button></a>
            <div id="user-name" class="d-none align-items-center gap-2 text-white">
                <i class="bi bi-person-circle fs-5"></i>
                <p id="user-name-text" class="mb-0"></p>
            </div>
        </div>
    </header>

    <main>
      <div class="container h-75 overflow-auto">
        <div class="row h-100 justify-content-center align-items-center">
          <div class="col-lg-4 bg-white rounded p-4">
            <h3 class="mb-3">Login</h3>

            <!-- Formulario para login usuario -->
            <form id="login-user" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  minlength="4"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
              <p id="login-msg" class="mt-3 mb-0" hidden></p>
              <p class="text-muted small mt-3 mb-0">Prueba con <code>dafler@dafler.com</code> / <code>1234</code></p>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>Tándem Dafler App · Producto 1 - FP.450 Desarrollo FullStack</p>
    </footer>
  </body>
  <script type="module" src="js/login.js"></script>
</html>
