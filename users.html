<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dafler - Usuarios</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>

    <!-- Estilos de css -->
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <!-- Estilos externos -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  </head>
  <body>
    <header>
        <div class="logo-box"> 
            <a href="index.html">
                <span id="logo-img" class="material-symbols-rounded">translate</span>
                <div id="logo-text">Tándem Dafler App</div>
            </a>
        </div>

        <div class="nav-box">
            <ul><li><a href="index.html">Dashboard</a></li></ul>
            <ul><li><a href="">Intercambios</a></li></ul>
            <ul><li><a href="users.html">Usuarios</a></li></ul>
        </div>

        <div class="login-btn-box">
            <a href="login.html"><button>
                <span id="logo-img" class="material-symbols-rounded">login</span>
                <p>Login</p>
            </button></a>
        </div>
    </header>

    <main>
      <div class="container h-75 overflow-auto">
        <div class="mb-4">
          <h1>Gestión de usuarios</h1>
        </div>

        <div class="row g-4">
          <div class="col-lg-4">
            <div class="bg-white rounded p-4">
              <h3 class="mb-3">Nuevo usuario</h3>

              <!-- Formulario para añadir usuario -->
              <form id="formAddUser" novalidate>
                <div class="mb-3">
                  <label for="name" class="form-label">Nombre</label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    minlength="4"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="nativeLang" class="form-label">Idioma nativo</label>
                  <select
                    class="form-select"
                    id="nativeLang"
                    required
                  ></select>
                </div>
                <div class="mb-3">
                  <label for="city" class="form-label">Ciudad</label>
                  <input
                    type="text"
                    class="form-control"
                    id="city"
                    required
                  />
                </div>

                <button type="submit" class="btn btn-primary w-100">Añadir</button>
              </form>

            </div>
          </div>

          <div class="col-lg-8">
            <div class="bg-white rounded p-4">
              <h3 class="mb-3">
                Usuarios registrados (<span id="count">0</span>)
              </h3>

              <div class="table-responsive">

                <!-- Tabla de usuarios -->
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Email</th>
                      <th>Idioma nativo</th>
                      <th>Ciudad</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="usersTable"></tbody>
                </table>

              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>Tándem Dafler App · Producto 1 - FP.450 Desarrollo FullStack</p>
    </footer>
  </body>
  <script type="module" src="js/users.js"></script>
</html>
