<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dafler - Dashboard</title>

    <!-- Estilos de css -->
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/footer.css">

    <!-- Estilos externos -->
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    
    <header>
        <div class="logo-box"> 
            <a href="index.html">
                <span id="logo-img" class="material-symbols-rounded">translate</span>
                <div id="logo-text">Tándem Dafler App</div>
            </a>
        </div>

        <div class="nav-box">
            <ul><li><a href="index.html">Dashboard</a></li></ul>
            <ul><li><a href="">Intercambios</a></li></ul>
            <ul><li><a href="">Usuarios</a></li></ul>
        </div>

        <div class="login-btn-box">
            <a href=""><button>
                <span id="logo-img" class="material-symbols-rounded">login</span>
                <p>Login</p>
            </button></a>
        </div>
    </header>

    <main>
        <div class="main-content">
            <div class="main-content-header">
                <h1>Tablón de intercambios de idiomas</h1>
                <h2>Encuentra con quién practicar el idioma que estas aprendiendo u ofrece el tuyo.</h2>
            </div>
            <div class="main-content-index">
                <div class="main-content-index-text">
                    <div class="dot offer"></div>
                    <p>Oferta</p>
                </div>
                <div class="main-content-index-text">
                    <div class="dot petition"></div>
                    <p>Petición</p>
                </div>
            </div>
            <div class="main-content-slider">
                <div class="slider-header">
                    <h3>Ofertas</h3>
                </div>
                <div class="slider-cards-content">
                    <div class="card offer"></div>
                </div>
            </div>

            <div class="main-content-slider">
                <div class="slider-header">
                    <h3>Peticiones</h3>
                </div>
                <div class="slider-cards-content">
                    <div class="card petition"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Tándem Dafler App · Producto 1 - FP.450 Desarrollo FullStack</p>
    </footer>

</body>
<script type="module" src="js/dashboard.js"></script>
</html>
